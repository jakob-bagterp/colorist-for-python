name: Test

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Install tox on the Python version of the matrix entry, as tox-gh-actions selects the tox environment by the Python version that tox runs on:
      - name: Install tox
        # Use the versions of tox and its plugins pinned in the dev dependency group, so a new tox release can't break CI before Dependabot proposes it:
        shell: bash
        run: |
          uv export --python ${{ matrix.python-version }} --only-group dev --no-hashes --no-emit-project --no-header --output-file "$RUNNER_TEMP/constraints.txt"
          uv tool install tox --python ${{ matrix.python-version }} --with tox-uv --with tox-gh-actions --constraints "$RUNNER_TEMP/constraints.txt"

      - name: Run tests with Tox
        env:
          # Lets a test verify that the job tests the Python version of its matrix entry:
          EXPECTED_PYTHON_VERSION: ${{ matrix.python-version }}
        run: tox
